<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Главная страница</title>
		<link rel="stylesheet" href="src/scss/styles.scss" />
		<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
	</head>
	<body data-page="main">
		<!-- preloader -->
		<div class="preloader">
			<div class="preloader__spinner"></div>
		</div>

		<!-- header() -->
		<!-- prettier-ignore -->
		{% from "src/partials/modules/header.njk" import header %}
    {{ header() }}

		<main class="main-content">
			<!-- main-top -->
			<section class="main-top">
				<!-- bannerVideo( posterPath, videoPath ) -->
				<!-- prettier-ignore -->
				{% from "src/partials/components/banner/banner-video.njk" import bannerVideo %}
        {{ bannerVideo( "/images/jpg/top/main.jpg", "/videos/main-top.mp4" ) }}
			</section>
		</main>

		<!-- footer() -->
		<!-- prettier-ignore -->
		{% from "src/partials/modules/footer.njk" import footer %}
    {{ footer() }}

		<script type="module" src="src/js/pages/main/scripts.js"></script>
		<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
	</body>
</html>
